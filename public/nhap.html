<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trung Thu Yêu Em</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    width: 100%;
    background: radial-gradient(ellipse at bottom, #000 0%, #020202 100%);
    touch-action: none;
    perspective: 800px;
  }

  /* Hiệu ứng sao lấp lánh */
  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 200%;
    height: 200%;
    background: radial-gradient(2px 2px at 20% 30%, #ffd700, transparent 60%),
                radial-gradient(2px 2px at 70% 80%, #ffdf70, transparent 60%),
                radial-gradient(2px 2px at 50% 10%, #fff8b0, transparent 60%),
                radial-gradient(2px 2px at 90% 40%, #fff9a3, transparent 60%),
                radial-gradient(2px 2px at 30% 90%, #ffda60, transparent 60%);
    background-size: 200px 200px;
    animation: twinkle 6s infinite alternate ease-in-out;
    opacity: 0.7;
    z-index: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.7; transform: scale(1) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.05) rotate(2deg); }
  }

  #playButton {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: hotpink;
    color: white;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    font-size: 1.5rem;
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px hotpink;
    animation: pulse 1.5s infinite;
    z-index: 9999;
  }

  @keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .floating {
    position: absolute;
    color: hotpink;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    white-space: nowrap;
    user-select: none;
    transform-style: preserve-3d;
    opacity: 0.8;
    will-change: transform;
    text-shadow: 0 0 8px hotpink;
  }

  .image {
    position: absolute;
    width: 15vw;
    max-width: 80px;
    height: auto;
    user-select: none;
    opacity: 0.9;
    transform-style: preserve-3d;
    will-change: transform;
    filter: drop-shadow(0 0 6px pink);
  }

  #statusText {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: hotpink;
    font-family: sans-serif;
    font-size: 0.9rem;
    opacity: 0.8;
  }
</style>
</head>
<body>

<audio id="bgm" preload="auto" loop>
  <source src="./image-audio/Thằng Cuội Trung Thu Cover - The Boy Cuoi Mid Autumn Festival Vietnamese Music Piano + Lyrics - tinywrist Cổ Tay Tí Hon Nhạc thiếu nhi VN (youtube).mp3" type="audio/mpeg">
</audio>

<button id="playButton">🎵 Phát nhạc</button>
<div id="statusText"></div>

<script>
const texts = [
  "Anh yêu em so lắm",
  "Trung thu vui vẻ",
  "Anh thương em so lắm",
  "Cảm ơn em vì tất cả",
  "Ngủ ngon",
  "Aye",
  "Moahhhh"
];

const images = [
  "./image-audio/IMG_0473.png",
  "./image-audio/IMG_0582.JPG",
  "./image-audio/IMG_2164.JPG",
  "./image-audio/IMG_2785.png",
  "./image-audio/IMG_2812.JPG"
];

let rotationX = 0, rotationY = 0;
let isDragging = false, lastX = 0, lastY = 0;
let floatingElements = [];
let isStarted = false;

const bgm = document.getElementById("bgm");
const statusText = document.getElementById("statusText");

function createFloatingElement(type = "text") {
  const el = document.createElement(type === "text" ? "div" : "img");
  el.className = type === "text" ? "floating" : "image";

  if (type === "text") {
    el.textContent = texts[Math.floor(Math.random() * texts.length)];
    el.style.fontSize = (Math.random() * 1.3 + 1) + "rem";
  } else {
    el.src = images[Math.floor(Math.random() * images.length)];
  }

  // Xác định lớp (near, mid, far)
  const layer = Math.floor(Math.random() * 3); // 0: gần, 1: giữa, 2: xa
  el.dataset.layer = layer;
  let depthZ = layer === 0 ? 200 : layer === 1 ? 0 : -300;

  el.dataset.x = Math.random() * window.innerWidth;
  el.dataset.y = window.innerHeight + Math.random() * 200;
  el.dataset.z = depthZ + (Math.random() * 50 - 25);
  el.dataset.speed = (Math.random() * 0.5 + 0.2).toFixed(2);

  document.body.appendChild(el);
  floatingElements.push(el);
}

function animate() {
  if (!isStarted) return;

  floatingElements.forEach((el, i) => {
    let y = parseFloat(el.dataset.y);
    y -= parseFloat(el.dataset.speed) * 2.5;
    if (y < -150) {
      el.remove();
      floatingElements.splice(i, 1);
    } else {
      el.dataset.y = y;
      const x = parseFloat(el.dataset.x);
      const z = parseFloat(el.dataset.z);

      // Hiệu ứng parallax: lớp xa di chuyển chậm hơn khi xoay
      const layer = parseInt(el.dataset.layer);
      const parallaxFactor = layer === 0 ? 1.3 : layer === 1 ? 0.9 : 0.6;

      el.style.transform = `
        translate3d(${x}px, ${y}px, ${z}px)
        rotateY(${rotationY * parallaxFactor}deg)
        rotateX(${rotationX * parallaxFactor}deg)
      `;
    }
  });

  if (floatingElements.length < 25) {
    if (Math.random() > 0.5) createFloatingElement("text");
    else createFloatingElement("image");
  }

  requestAnimationFrame(animate);
}

function setupControls() {
  document.addEventListener("mousedown", e => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  document.addEventListener("mousemove", e => {
    if (!isDragging) return;
    rotationY += (e.clientX - lastX) * 0.25;
    rotationX -= (e.clientY - lastY) * 0.25;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  document.addEventListener("mouseup", () => isDragging = false);

  // Cảm ứng
  document.addEventListener("touchstart", e => {
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  });

  document.addEventListener("touchmove", e => {
    if (!isDragging) return;
    rotationY += (e.touches[0].clientX - lastX) * 0.3;
    rotationX -= (e.touches[0].clientY - lastY) * 0.3;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  });

  document.addEventListener("touchend", () => isDragging = false);
}

setupControls();

// Phát nhạc khi bấm
document.getElementById("playButton").addEventListener("click", async () => {
  try {
    await bgm.play();
    document.getElementById("playButton").style.display = "none";
    statusText.innerText = "🎶 Nhạc đang phát.. Cho Quỳnh Như anh yêu em!";
    isStarted = true;
    animate();
  } catch (err) {
    statusText.innerText = "⚠️ Không thể phát nhạc (kiểm tra file hoặc quyền âm thanh).";
    console.error("Không thể phát nhạc:", err);
  }
});
</script>
</body>
</html>

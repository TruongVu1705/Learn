<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Quan trọng -->
  <title>Google Maps</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Google_Maps_icon_%282020%29.svg/1200px-Google_Maps_icon_%282020%29.svg.png" type="image/png">
</head>
<body>
  <div class="login-container">
    <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" class="logo" alt="Logo">
    <h2>Sign in</h2>
    <p>Please sign in to continue to the app.</p>
    <form id="loginForm" method="POST" novalidate>
      <input id="loginIdentifier" type="text" placeholder="Email" required>
      <div class="error" id="emailError" aria-live="polite"></div>

      <div class="password-field">
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button type="button" id="togglePwd" class="pwd-toggle" aria-label="Show password" aria-pressed="false">
          <!-- eye icon (visible = show password) -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M1 12s4 7 11 7 11-7 11-7-4-7-11-7S1 12 1 12z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <div class="error" id="passwordError" aria-live="polite"></div>

      <div class="form-message" id="loginFormMsg" aria-live="polite"></div>

      <button class="btn" type="submit">Next</button>
    </form>
    <div class="footer-links">
      <a href="createAcc.html">Create account</a>
      <a href="forgotPass.html">Forgot password?</a>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
